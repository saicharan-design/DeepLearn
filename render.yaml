services:
  - type: web
    name: deeplearn
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 90
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false          # you paste this in the Render dashboard (never in GitHub)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: FACULTY_KEY
        generateValue: true  # Render creates it; read it in the Environment tab
